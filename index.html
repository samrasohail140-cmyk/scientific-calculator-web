<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyberpunk Math Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --bg-color: #05050a;
      --card-bg: rgba(10, 10, 18, 0.85);
      --neon-cyan: #00ffcc;
      --neon-pink: #ff007f;
      --neon-yellow: #f3e600;
      --text-main: #ffffff;
      --text-muted: #6b7280;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Share Tech Mono', monospace;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-color);
      background-image: 
        linear-gradient(rgba(0, 255, 204, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 204, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: var(--text-main);
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: var(--neon-cyan);
      filter: blur(120px);
      opacity: 0.15;
      top: 10%;
      left: 20%;
      z-index: 0;
    }

    body::after {
      content: '';
      position: absolute;
      width: 350px;
      height: 350px;
      background: var(--neon-pink);
      filter: blur(140px);
      opacity: 0.15;
      bottom: 10%;
      right: 20%;
      z-index: 0;
    }

    .calculator-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 2px solid rgba(0, 255, 204, 0.3);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.15), inset 0 0 15px rgba(0, 255, 204, 0.05);
      backdrop-filter: blur(20px);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.15);
      padding-bottom: 12px;
    }

    .app-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--neon-cyan);
      letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(0, 255, 204, 0.5);
    }

    .display-screen {
      background: #020205;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 16px;
      text-align: right;
      margin-bottom: 20px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }

    .history-text {
      font-size: 1rem;
      color: var(--text-muted);
      min-height: 22px;
      margin-bottom: 4px;
    }

    .current-text {
      font-size: 2.2rem;
      font-weight: 600;
      color: var(--neon-yellow);
      text-shadow: 0 0 10px rgba(243, 230, 0, 0.4);
      word-break: break-all;
    }

    .keys-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .btn {
      height: 54px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-main);
      font-size: 1.25rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: rgba(0, 255, 204, 0.1);
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
      transform: translateY(-2px);
    }

    .btn-op {
      color: var(--neon-cyan);
      border-color: rgba(0, 255, 204, 0.3);
      background: rgba(0, 255, 204, 0.05);
    }

    .btn-clear {
      color: var(--neon-pink);
      border-color: rgba(255, 0, 127, 0.3);
      background: rgba(255, 0, 127, 0.05);
    }

    .btn-clear:hover {
      background: var(--neon-pink);
      color: #000;
      box-shadow: 0 0 10px var(--neon-pink);
    }

    .btn-equals {
      background: var(--neon-cyan);
      color: #000;
      border: none;
      font-weight: bold;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
    }

    .btn-equals:hover {
      background: #fff;
      box-shadow: 0 0 20px #fff;
      color: #000;
    }

    .history-drawer {
      margin-top: 16px;
      padding-top: 10px;
      border-top: 1px dashed rgba(255, 255, 255, 0.15);
      max-height: 110px;
      overflow-y: auto;
    }

    .history-title {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      letter-spacing: 1px;
    }

    .history-list {
      list-style: none;
      font-size: 0.85rem;
      color: #9ca3af;
    }

    .history-item {
      padding: 3px 0;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      transition: color 0.2s;
    }

    .history-item:hover {
      color: var(--neon-cyan);
    }

    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--neon-cyan);
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <div class="calculator-card">
    <div class="header">
      <div class="app-title"><i class="fa-solid fa-terminal"></i> CYBER_CALC</div>
    </div>

    <div class="display-screen">
      <div class="history-text" id="historyDisplay"></div>
      <div class="current-text" id="currentDisplay">0</div>
    </div>

    <div class="keys-grid">
      <button class="btn btn-clear" onclick="clearAll()">AC</button>
      <button class="btn btn-clear" onclick="deleteChar()"><i class="fa-solid fa-delete-left"></i></button>
      <button class="btn btn-op" onclick="appendValue('%')">%</button>
      <button class="btn btn-op" onclick="appendValue('/')">÷</button>

      <button class="btn" onclick="appendValue('7')">7</button>
      <button class="btn" onclick="appendValue('8')">8</button>
      <button class="btn" onclick="appendValue('9')">9</button>
      <button class="btn btn-op" onclick="appendValue('*')">×</button>

      <button class="btn" onclick="appendValue('4')">4</button>
      <button class="btn" onclick="appendValue('5')">5</button>
      <button class="btn" onclick="appendValue('6')">6</button>
      <button class="btn btn-op" onclick="appendValue('-')">-</button>

      <button class="btn" onclick="appendValue('1')">1</button>
      <button class="btn" onclick="appendValue('2')">2</button>
      <button class="btn" onclick="appendValue('3')">3</button>
      <button class="btn btn-op" onclick="appendValue('+')">+</button>

      <button class="btn" onclick="appendValue('00')">00</button>
      <button class="btn" onclick="appendValue('0')">0</button>
      <button class="btn" onclick="appendValue('.')">.</button>
      <button class="btn btn-equals" onclick="calculateResult()">=</button>
    </div>

    <div class="history-drawer">
      <div class="history-title">
        <span>LOGS</span>
        <span style="cursor: pointer;" onclick="clearHistory()">CLEAR</span>
      </div>
      <ul class="history-list" id="historyList"></ul>
    </div>
  </div>

  <script>
    const currentDisplay = document.getElementById('currentDisplay');
    const historyDisplay = document.getElementById('historyDisplay');
    const historyList = document.getElementById('historyList');

    let expression = '';
    let shouldResetScreen = false;

    function appendValue(val) {
      if (shouldResetScreen) {
        expression = '';
        shouldResetScreen = false;
      }
      if (currentDisplay.innerText === '0' && val !== '.') {
        expression = '';
      }
      expression += val;
      updateDisplay();
    }

    function updateDisplay() {
      currentDisplay.innerText = expression || '0';
    }

    function clearAll() {
      expression = '';
      historyDisplay.innerText = '';
      shouldResetScreen = false;
      updateDisplay();
    }

    function deleteChar() {
      if (shouldResetScreen) return;
      expression = expression.slice(0, -1);
      updateDisplay();
    }

    function calculateResult() {
      if (!expression) return;
      try {
        let result = eval(expression.replace(/×/g, '*').replace(/÷/g, '/'));
        if (typeof result === 'number' && !Number.isInteger(result)) {
          result = parseFloat(result.toFixed(6));
        }
        historyDisplay.innerText = expression + ' =';
        addHistoryLog(expression, result);
        expression = result.toString();
        shouldResetScreen = true;
        updateDisplay();
      } catch (error) {
        currentDisplay.innerText = 'ERROR';
        expression = '';
        shouldResetScreen = true;
      }
    }

    function addHistoryLog(expr, res) {
      const li = document.createElement('li');
      li.className = 'history-item';
      li.innerHTML = `<span>${expr}</span><span>= ${res}</span>`;
      li.onclick = () => {
        expression = res.toString();
        shouldResetScreen = false;
        updateDisplay();
      };
      historyList.prepend(li);
    }

    function clearHistory() {
      historyList.innerHTML = '';
    }
  </script>
</body>
</html>
